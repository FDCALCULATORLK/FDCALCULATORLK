<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- Navy rounded badge background -->
  <rect x="5" y="5" width="110" height="110" rx="24" ry="24" fill="#0B2545" stroke="#B8892B" stroke-width="2"/>
  
  <!-- Outer gold accent ring line -->
  <rect x="10" y="10" width="100" height="100" rx="19" ry="19" fill="none" stroke="#B8892B" stroke-width="1" stroke-dasharray="4 2" opacity="0.6"/>

  <!-- FD Monogram -->
  <text x="34" y="72" font-family="Georgia, Lora, serif" font-size="44" font-weight="bold" fill="#FBF9F4" letter-spacing="-1">FD</text>

  <!-- 3 Rising Gold Bars Glyph -->
  <g transform="translate(80, 44)">
    <!-- Bar 1 -->
    <rect x="0" y="24" width="5" height="12" rx="1" fill="#B8892B"/>
    <!-- Bar 2 -->
    <rect x="8" y="14" width="5" height="22" rx="1" fill="#B8892B"/>
    <!-- Bar 3 -->
    <rect x="16" y="4" width="5" height="32" rx="1" fill="#D4AF37"/>
    <!-- Arrow tip on bar 3 -->
    <polygon points="18.5,0 14,5 23,5" fill="#D4AF37"/>
  </g>
</svg>
